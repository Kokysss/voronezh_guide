<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Связаться с нами</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <script src="script.js" defer></script>
</head>
<body class="bg-light">

<header class="bg-dark py-2">
  <nav class="navbar navbar-expand-lg navbar-dark container">
    <a class="navbar-brand fw-bold" href="index.html">ВоронежГид</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="index.html">Главная</a>
      <a class="nav-link" href="places.html">Места</a>
      <a class="nav-link active" href="contact.html">Контакты</a>
    </div>
  </nav>
</header>

<main class="container my-5" style="max-width: 700px;">
  <h1 class="mb-3">Свяжитесь с нами</h1>
  <p class="text-muted mb-4">Если у вас есть вопросы или предложения по развитию нашего путеводителя, напишите нам!</p>

  <form id="contactForm" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label for="name" class="form-label">Ваше имя</label>
      <input type="text" class="form-control" id="name" placeholder="Введите имя">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Электронная почта</label>
      <input type="email" class="form-control" id="email" placeholder="example@mail.ru">
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Сообщение</label>
      <textarea class="form-control" id="message" rows="5" placeholder="Ваше сообщение..."></textarea>
    </div>
    <button type="submit" class="btn btn-danger">Отправить</button>

    <p id="formMessage" class="mt-3 mb-0"></p>
  </form>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
  <p class="mb-0">© 2026 Путеводитель по Воронежу. Сделано с любовью.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
