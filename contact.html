<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Связаться с нами</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">ВоронежГид</div>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="places.html">Места</a></li>
                <li><a href="contact.html" class="active">Контакты</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <h1>Свяжитесь с нами</h1>
        <p>Если у вас есть вопросы или предложения по развитию нашего путеводителя, напишите нам!</p>
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" placeholder="Введите имя">
            </div>
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" placeholder="example@mail.ru">
            </div>
            <div class="form-group">
                <label for="message">Сообщение</label>
                <textarea id="message" rows="5" placeholder="Ваше сообщение..."></textarea>
            </div>
            <button type="submit" class="btn">Отправить</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Путеводитель по Воронежу. Сделано с любовью.</p>
    </footer>
</body>
</html>
